<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dark Web Scanner — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
      --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --accent: #58a6ff; --red: #f85149; --green: #3fb950;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px; width: 100%; max-width: 420px;
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 1.4rem; font-weight: 700; }
    .logo .badge {
      display: inline-block; background: var(--red); color: white;
      font-size: 0.65rem; padding: 2px 8px; border-radius: 20px;
      font-weight: 700; letter-spacing: 0.05em; margin-left: 8px; vertical-align: middle;
    }
    .logo p { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .flash { padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 20px; }
    .flash.error { background: rgba(248,81,73,0.15); border: 1px solid rgba(248,81,73,0.4); color: #f85149; }
    .flash.success { background: rgba(63,185,80,0.15); border: 1px solid rgba(63,185,80,0.4); color: #3fb950; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); padding: 10px 14px;
      font-size: 0.9rem; transition: border-color 0.15s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 6px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-primary:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Dark Web Scanner <span class="badge">THREAT INTEL</span></h1>
      <p>Sign in to access the dashboard</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
  </div>
</body>
</html>
