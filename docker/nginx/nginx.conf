user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real client address. Behind Cloudflare the TCP peer is always a Cloudflare
    # address; the visitor is in CF-Connecting-IP, trusted only from Cloudflare's
    # own ranges. $remote_addr below (logs, rate limits, X-Real-IP) is the visitor.
    include /etc/nginx/cloudflare-realip.conf;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Hide nginx version
    server_tokens off;

    # Docker's embedded DNS. Together with a variable in proxy_pass this makes
    # nginx look names up at request time, so a recreated dashboard container is
    # found without restarting nginx, and nginx starts even when a name is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Rate limits per visitor: sign-in pages, and the public relays on the threat-watch site.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=relay:10m rate=30r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
